{% extends 'base.html' %}{% block title %}{{ 'Edit' if item.id else 'New' }} {{ kind[:-1] }}{% endblock %}{% block content %}<div class="page-heading"><div><a class="back" href="{{ url_for(kind) }}">← Back</a><h1>{{ 'Edit' if item.id else 'New' }} {{ kind[:-1] }}</h1></div></div><form class="panel form" method="post"><div class="form-grid"><label>Name <b>*</b><input required name="name" value="{{ item.name or '' }}"></label><label>Short name <b>*</b><input required name="short_name" value="{{ item.short_name or '' }}"></label>{% if is_pathway %}<label class="full">Geography<input name="geography" value="{{ item.geography or '' }}"></label>{% endif %}<label class="full">Description<textarea name="description" rows="5">{{ item.description or '' }}</textarea></label>{% if is_pathway %}<label class="full">Notes<textarea name="notes" rows="3">{{ item.notes or '' }}</textarea></label>{% endif %}<label>Label color<input type="color" name="color" value="{{ item.color or '#656d76' }}"></label><label class="checkbox"><input type="checkbox" name="active" {% if item.active or item.id is none %}checked{% endif %}> Active</label></div><div class="form-actions"><button class="button primary">Save {{ kind[:-1] }}</button><a class="button" href="{{ url_for(kind) }}">Cancel</a></div></form>{% endblock %}
