{% extends 'base.html' %}{% block title %}Edit contact{% endblock %}{% block content %}<div class="page-heading"><div><a class="back" href="{{ url_for('application_detail',item_id=contact.application_id) }}">← {{ contact.application.company }}</a><h1>Edit contact</h1></div></div><form class="panel form" method="post"><div class="form-grid"><label>Name <b>*</b><input required name="name" value="{{ contact.name }}"></label><label>Title<input name="title" value="{{ contact.title }}"></label><label>Organization<input name="organization" value="{{ contact.organization }}"></label><label>Email<input type="email" name="email" value="{{ contact.email }}"></label><label>LinkedIn URL<input type="url" name="linkedin_url" value="{{ contact.linkedin_url }}"></label><label>Outreach date<input type="date" name="outreach_date" value="{{ contact.outreach_date.isoformat() if contact.outreach_date else '' }}"></label><label>Outreach status<select name="outreach_status">{% for s in outreach_statuses %}<option {% if contact.outreach_status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="full">Notes<textarea name="notes" rows="5">{{ contact.notes }}</textarea></label></div><div class="form-actions"><button class="button primary">Save contact</button><a class="button" href="{{ url_for('application_detail',item_id=contact.application_id) }}">Cancel</a></div></form>{% endblock %}
