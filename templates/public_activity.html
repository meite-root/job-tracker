<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Public Job Search Activity</title>
  <style>
    :root{color-scheme:light;--bg:#f6f8fa;--surface:#fff;--border:#d0d7de;--text:#1f2328;--muted:#656d76}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:#24292f;color:#fff}.header-inner,main{max-width:820px;margin:auto;padding-left:24px;padding-right:24px}.header-inner{height:56px;display:flex;align-items:center;font-size:16px;font-weight:600}
    main{padding-top:36px;padding-bottom:60px}h1{font-size:26px;line-height:1.25;margin:0 0 4px}main>p{color:var(--muted);margin:0 0 24px}
    .feed{background:var(--surface);border:1px solid var(--border);border-radius:6px}.event{display:grid;grid-template-columns:175px 1fr;gap:18px;padding:18px;border-bottom:1px solid var(--border)}.event:last-child{border:0}
    time,.label{color:var(--muted);font-size:12px}.company{font-weight:600;margin:0}.description{margin:2px 0 8px}.label{display:inline-block;border:1px solid var(--border);border-radius:2em;padding:1px 8px}.empty{text-align:center;color:var(--muted);padding:36px}
    @media(max-width:600px){.header-inner,main{padding-left:16px;padding-right:16px}main{padding-top:26px}.event{grid-template-columns:1fr;gap:5px}}
  </style>
</head>
<body>
  <header><div class="header-inner">Public Activity</div></header>
  <main>
    <h1>Job Search Activity</h1>
    <p>Recent progress in my job search.</p>
    <section class="feed" aria-label="Recent public job search activity">
      {% for event in activities %}
      <article class="event">
        <time datetime="{{ event.created_at.isoformat() }}">{{ event.created_at.strftime('%b %-d, %Y · %H:%M') }}</time>
        <div><p class="company">{{ event.company }}</p><p class="description">{{ event.description }}</p><span class="label">{{ event.event_type|replace('_', ' ') }}</span></div>
      </article>
      {% else %}<p class="empty">No public activity yet.</p>{% endfor %}
    </section>
  </main>
</body>
</html>
