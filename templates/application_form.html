{% extends 'base.html' %}{% block title %}{{ 'Edit' if item.id else 'New' }} application{% endblock %}{% block content %}
<div class="page-heading"><div><a class="back" href="{{ url_for('application_detail',item_id=item.id) if item.id else url_for('applications') }}">← Back</a><h1>{{ 'Edit application' if item.id else 'New application' }}</h1></div></div>
<form class="panel form" method="post"><div class="form-grid">
<label>Company <b>*</b><input required name="company" value="{{ request.form.get('company',item.company or '') }}"></label><label>Role title <b>*</b><input required name="role_title" value="{{ request.form.get('role_title',item.role_title or '') }}"></label>
<label>Pathway <b>*</b><select required name="pathway_id"><option value="">Select…</option>{% for p in pathways %}<option value="{{ p.id }}" {% if request.form.get('pathway_id',item.pathway_id)|int == p.id %}selected{% endif %}>{{ p.name }}{% if not p.active %} (inactive){% endif %}</option>{% endfor %}</select></label>
<label>Persona <b>*</b><select required name="persona_id"><option value="">Select…</option>{% for p in personas %}<option value="{{ p.id }}" {% if request.form.get('persona_id',item.persona_id)|int == p.id %}selected{% endif %}>{{ p.name }}{% if not p.active %} (inactive){% endif %}</option>{% endfor %}</select></label>
<label>Location<input name="location" value="{{ request.form.get('location',item.location or '') }}"></label><label>Job URL<input type="url" name="job_url" value="{{ request.form.get('job_url',item.job_url or '') }}" placeholder="https://"></label>
<label>Date applied<input type="date" name="date_applied" value="{{ request.form.get('date_applied',item.date_applied.isoformat() if item.date_applied else '') }}"></label><label>Status<select name="status">{% for s in statuses %}<option {% if request.form.get('status',item.status or 'Interested') == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
<label class="full">Next action<textarea name="next_action" rows="2" placeholder="What should I do next?">{{ request.form.get('next_action',item.next_action or '') }}</textarea></label><label>Next action due<input type="date" name="next_action_date" value="{{ request.form.get('next_action_date',item.next_action_date.isoformat() if item.next_action_date else '') }}"></label>
<label class="full">Notes<textarea name="notes" rows="7">{{ request.form.get('notes',item.notes or '') }}</textarea></label></div><div class="form-actions"><button class="button primary">Save application</button><a class="button" href="{{ url_for('applications') }}">Cancel</a></div></form>
{% endblock %}
