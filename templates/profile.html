{% extends 'base.html' %}{% block title %}PDF profile{% endblock %}{% block content %}<div class="page-heading"><div><h1>PDF profile</h1><p>Used only in generated letter headers.</p></div></div><form class="form panel" method="post"><div class="form-grid"><label>Full name <b>*</b><input required name="full_name" value="{{ item.full_name }}"></label><label>Location<input name="location" value="{{ item.location }}"></label><label>Email<input type="email" name="email" value="{{ item.email }}"></label><label>Phone<input name="phone" value="{{ item.phone }}"></label><label class="full">LinkedIn URL<input type="url" name="linkedin_url" value="{{ item.linkedin_url }}"></label></div><div class="form-actions"><a class="button" href="{{ url_for('files') }}">Cancel</a><button class="button primary">Save profile</button></div></form>{% endblock %}
